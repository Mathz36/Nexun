services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: '3026'
      NODE_ENV: production
      SANKHYA_API_URL: ${SANKHYA_API_URL}
      SANKHYA_SERVICE_URL: ${SANKHYA_SERVICE_URL}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      GRANT_TYPE: ${GRANT_TYPE:-client_credentials}
      DATA_DIR: ./data
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:3026
      HOST: 0.0.0.0
      PORT: '3027'
    depends_on:
      - backend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev --workspace frontend -- --host 0.0.0.0 --port 3027"
